# Render Blueprint: Quotebird marketing site (static, no server).
# In Render: New → Blueprint → pick this repo. Render rebuilds on every push to main.
services:
  - type: web
    name: quotebird-site
    runtime: static
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      # The app that receives pilot sign-ups.
      - key: NEXT_PUBLIC_APP_ORIGIN
        value: https://app.quotebird.ai
      # Real key from the Cloudflare account; until then sign-ups show "Sign-ups open soon".
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        value: TURNSTILE_SITE_KEY_PLACEHOLDER
      # Turn on once app.quotebird.ai is live; until then the pilot page shows a WhatsApp button.
      - key: NEXT_PUBLIC_PILOT_FORM
        value: "off"
      # Cloudflare Web Analytics token; empty = analytics off.
      - key: NEXT_PUBLIC_CF_BEACON_TOKEN
        value: ""
